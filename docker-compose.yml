# Single compose file for the bare metal/VM/local path. deploy-local.sh
# decides what actually runs:
#   - app always runs.
#   - nginx/certbot only run when deploy-local.sh passes `--profile ssl`
#     (i.e. SSL_MODE=managed in config.env).
#   - APP_BIND_ADDR is set by deploy-local.sh: 0.0.0.0 when there's no proxy
#     in front (SSL_MODE=external), 127.0.0.1 when nginx is fronting it
#     (SSL_MODE=managed) so the app is never reachable except through nginx.

services:
  eka-webhook-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CLIENT_NAME: ${CLIENT_NAME:-eka}
    image: ${APP_IMAGE:-eka-webhook:local}
    container_name: eka-webhook-app
    restart: unless-stopped
    env_file:
      - config.env
    # The app always listens on 80 inside the container/docker network,
    # regardless of PORT (config.env's PORT is only the host-published port
    # below - other containers on shared-network reach this one at
    # eka-webhook-app:80, not eka-webhook-app:${PORT}). The `environment:`
    # override here wins over env_file's PORT, which is host-value.
    environment:
      - PORT=80
    ports:
      - "${APP_BIND_ADDR:-0.0.0.0}:${PORT:-8080}:80"
    networks:
      - shared-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # eka-nginx-block:start (see --skip-nginx in deploy-local.sh - toggling
#EKA-SKIP-NGINX#   # that flag comments/uncomments everything between these two markers)
#EKA-SKIP-NGINX#   # Only started when the "ssl" profile is active (SSL_MODE=managed).
#EKA-SKIP-NGINX#   nginx:
#EKA-SKIP-NGINX#     image: nginx:1.27-alpine
#EKA-SKIP-NGINX#     container_name: eka-webhook-nginx
#EKA-SKIP-NGINX#     profiles: ["ssl"]
#EKA-SKIP-NGINX#     restart: unless-stopped
#EKA-SKIP-NGINX#     depends_on:
#EKA-SKIP-NGINX#       - eka-webhook-app
#EKA-SKIP-NGINX#     ports:
#EKA-SKIP-NGINX#       - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
#EKA-SKIP-NGINX#       - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
#EKA-SKIP-NGINX#     volumes:
#EKA-SKIP-NGINX#       # Overwrites the image's own conf.d/default.conf so there's exactly one
#EKA-SKIP-NGINX#       # server block handling port 80/443 - no ambiguity with nginx's stock
#EKA-SKIP-NGINX#       # welcome-page config if a request's Host header doesn't match ours.
#EKA-SKIP-NGINX#       - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
#EKA-SKIP-NGINX#       - ./nginx/ssl-enabled:/etc/nginx/ssl-enabled:ro
#EKA-SKIP-NGINX#       - certbot_webroot:/var/www/certbot:ro
#EKA-SKIP-NGINX#       - certbot_certs:/etc/letsencrypt:ro
#EKA-SKIP-NGINX#     networks:
#EKA-SKIP-NGINX#       - shared-network
#EKA-SKIP-NGINX#     logging:
#EKA-SKIP-NGINX#       driver: json-file
#EKA-SKIP-NGINX#       options:
#EKA-SKIP-NGINX#         max-size: "10m"
#EKA-SKIP-NGINX#         max-file: "5"
#EKA-SKIP-NGINX# 
#EKA-SKIP-NGINX#   # Long-running renewal loop. Initial issuance is a one-off `docker compose
#EKA-SKIP-NGINX#   # --profile ssl run --rm certbot certonly ...` invoked by deploy-local.sh
#EKA-SKIP-NGINX#   # during the SSL bootstrap step, after nginx is already serving the ACME
#EKA-SKIP-NGINX#   # HTTP-01 challenge on port 80.
#EKA-SKIP-NGINX#   certbot:
#EKA-SKIP-NGINX#     image: certbot/certbot:latest
#EKA-SKIP-NGINX#     container_name: eka-webhook-certbot
#EKA-SKIP-NGINX#     profiles: ["ssl"]
#EKA-SKIP-NGINX#     restart: unless-stopped
#EKA-SKIP-NGINX#     volumes:
#EKA-SKIP-NGINX#       - certbot_webroot:/var/www/certbot
#EKA-SKIP-NGINX#       - certbot_certs:/etc/letsencrypt
#EKA-SKIP-NGINX#     networks:
#EKA-SKIP-NGINX#       - shared-network
#EKA-SKIP-NGINX#     entrypoint: >
#EKA-SKIP-NGINX#       sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
#EKA-SKIP-NGINX#     logging:
#EKA-SKIP-NGINX#       driver: json-file
#EKA-SKIP-NGINX#       options:
#EKA-SKIP-NGINX#         max-size: "10m"
#EKA-SKIP-NGINX#         max-file: "5"
  # eka-nginx-block:end

volumes:
  certbot_webroot:
  certbot_certs:

networks:
  shared-network:
    external: true
